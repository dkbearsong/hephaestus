# Hephaestus User Preferences & System Configuration

# Preparations Step Configuration (runs after preparations.md and before Docker container creation)
preparations_step:
  enabled: true
  # Preferred provider: 'chatgpt' | 'gemini' | 'claude' | 'grok' | 'openrouter' | 'groq' | 'huggingface' | 'nvidia' | 'lm_studio' | 'ollama'
  provider: "gemini"
  model: "gemini-2.5-flash"
  max_iterations: 10
  temperature: 0.2
  endpoints:
    lm_studio: "http://localhost:1234/v1"
    ollama: "http://localhost:11434/v1"
    openai: "https://api.openai.com/v1"
    gemini: "https://generativelanguage.googleapis.com/v1beta/openai"
    claude: "https://api.anthropic.com/v1"
    grok: "https://api.x.ai/v1"
    openrouter: "https://openrouter.ai/api/v1"
    groq: "https://api.groq.com/openai/v1"
    huggingface: "https://api-inference.huggingface.co/v1"
    nvidia: "https://integrate.api.nvidia.com/v1"

# Coding Agent Harness Configuration
harness:
  # Active harness adapter: 'antigravity_daemon' | 'langgraph_agent'
  active: "antigravity_daemon"
  
  antigravity_daemon:
    headless_mode: true
    remote_control: true
    socket_path: "/var/run/antigravity.sock"
    default_model: "gemini-3.7-flash"
    timeout_seconds: 600
    # Autonomy boundaries
    auto_execute_commands: true
    require_approval_for_external_network: true
    allowed_domains:
      - "github.com"
      - "pypi.org"
      - "registry.npmjs.org"

  langgraph_agent:
    model: "gemini-3.7-flash"
    max_iterations: 25
    checkpoint_storage: "postgres" # 'postgres' | 'memory'

# Jira Webhook and Integration Settings
jira:
  trigger_label: "ai-code"
  new_project_trigger_prefix: "<|prompt-new|>"
  update_trigger_prefix: "<|prompt|>"
  preparations_trigger_prefix: "<|preparations|>"
  completion_label: "ai-merged"
  auto_remove_trigger_label: true
  transition_on_merge: "Done" # Jira workflow status to transition to on branch merge

# Docker Sandbox & Isolation Settings
docker:
  default_base_image: "python:3.12-slim"
  container_prefix: "hephaestus_"
  checkpoint_image_prefix: "hephaestus-checkpoint:"
  workspace_dir_inside_container: "/workspace"
  auto_commit_on_pause: true
  auto_prune_on_merge: true
  memory_limit: "4g"
  cpu_limit: 2.0

# Model Context Protocol (MCP) Tools Registry
# Place tools inside the `mcp_tools/` folder. Add tool identifiers here to activate them.
mcp_tools:
  tools_directory: "mcp_tools"
  enabled:
    - "datetime_tool"
    - "postgres_inspector"
    - "test_runner"
  available:
    - "datetime_tool"
    - "postgres_inspector"
    - "test_runner"
