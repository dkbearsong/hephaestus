# Hephaestus User Preferences & System Configuration

# Preparations Step Configuration (runs after preparations.md and before Coding Agent Orchestrator)
preparations_step:
  enabled: true
  # Preferred provider: 'chatgpt' | 'gemini' | 'claude' | 'grok' | 'openrouter' | 'groq' | 'huggingface' | 'nvidia' | 'lm_studio' | 'ollama'
  provider: "gemini"
  model: "gemini-2.5-flash"
  max_iterations: 10
  temperature: 0.2
  endpoints:
    lm_studio: "http://localhost:1234/v1"
    ollama: "http://localhost:11434/v1"
    openai: "https://api.openai.com/v1"
    gemini: "https://generativelanguage.googleapis.com/v1beta/openai"
    claude: "https://api.anthropic.com/v1"
    grok: "https://api.x.ai/v1"
    openrouter: "https://openrouter.ai/api/v1"
    groq: "https://api.groq.com/openai/v1"
    huggingface: "https://api-inference.huggingface.co/v1"
    nvidia: "https://integrate.api.nvidia.com/v1"

# Coding Agent Harness & Orchestrator Configuration
harness:
  # Active coding agent platform:
  # 'google_jules' | 'grok_build' | 'openai_codex_cloud' | 'docker_sandbox_claude_codex' | 'devin_ai' | 'openhands_canvas' | 'cursor_agent' | 'langgraph_agent'
  active: "google_jules"
  
  google_jules:
    model: "gemini-3.7-flash"
    container_type: "google_cloud_workspace"
    auto_execute_tests: true
    require_approval_for_external_network: true
    allowed_domains:
      - "github.com"
      - "google.com"
      - "pypi.org"

  grok_build:
    model: "grok-beta"
    container_type: "grok_build_sandbox"
    compiler_mode: "ast_parallel"
    require_approval_for_external_network: true
    allowed_domains:
      - "github.com"
      - "x.ai"
      - "pypi.org"

  openai_codex_cloud:
    model: "gpt-4o"
    container_type: "openai_cloud_sandbox"
    sandbox_timeout_seconds: 600
    require_approval_for_external_network: true
    allowed_domains:
      - "github.com"
      - "openai.com"
      - "pypi.org"

  docker_sandbox_claude_codex:
    engine: "claude_code" # 'claude_code' | 'openai_codex'
    container_type: "docker_sandbox_runner"
    base_image: "python:3.12-slim"
    timeout_seconds: 600
    require_approval_for_external_network: true
    allowed_domains:
      - "github.com"
      - "anthropic.com"
      - "openai.com"
      - "pypi.org"
      - "registry.npmjs.org"

  devin_ai:
    container_type: "devin_cloud_session"
    auto_install_dependencies: true
    require_approval_for_external_network: true
    allowed_domains:
      - "github.com"
      - "cognition.ai"
      - "pypi.org"

  openhands_canvas:
    runtime_url: "http://localhost:3000"
    container_type: "openhands_agent_canvas"
    canvas_visualizer: true
    require_approval_for_external_network: true
    allowed_domains:
      - "github.com"
      - "all-hands.dev"
      - "pypi.org"
      - "registry.npmjs.org"

  cursor_agent:
    mode: "cursor_cloud" # 'cursor_cloud' | 'cursor_dev_container'
    container_type: "cursor_cloud_workspace"
    devcontainer_image: "mcr.microsoft.com/devcontainers/python:3.12"
    require_approval_for_external_network: true
    allowed_domains:
      - "github.com"
      - "cursor.com"
      - "cursor.sh"
      - "pypi.org"
      - "registry.npmjs.org"

  langgraph_agent:
    model: "gemini-3.7-flash"
    max_iterations: 25
    checkpoint_storage: "postgres" # 'postgres' | 'memory'

# Jira Webhook and Integration Settings
jira:
  trigger_label: "ai-code"
  new_project_trigger_prefix: "<|prompt-new|>"
  update_trigger_prefix: "<|prompt|>"
  preparations_trigger_prefix: "<|preparations|>"
  completion_label: "ai-merged"
  auto_remove_trigger_label: true
  transition_on_merge: "Done" # Jira workflow status to transition to on branch merge

# Model Context Protocol (MCP) Tools Registry
mcp_tools:
  tools_directory: "mcp_tools"
  enabled:
    - "datetime_tool"
    - "postgres_inspector"
    - "test_runner"
  available:
    - "datetime_tool"
    - "postgres_inspector"
    - "test_runner"
