[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    data_processing: Tests for the data processing step that waits, receives, and verifies payload and tag extraction
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*StarletteDeprecationWarning.*
    ignore:.*httpx.*
